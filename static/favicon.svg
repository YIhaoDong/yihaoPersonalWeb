<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 30 30">
  <style>
    .bg { fill: #f5f5f7; }
    .off { fill: #c7cbd4; }
    .on { fill: #f08a24; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1d22; }
      .off { fill: #3a3d45; }
      .on { fill: #f5a524; }
    }
  </style>
  <rect class="bg" width="30" height="30" rx="6" />
  <circle class="on"  cx="5"  cy="5"  r="3.4" />
  <circle class="off" cx="15" cy="5"  r="3.4" />
  <circle class="on"  cx="25" cy="5"  r="3.4" />
  <circle class="off" cx="5"  cy="15" r="3.4" />
  <circle class="on"  cx="15" cy="15" r="3.4" />
  <circle class="off" cx="25" cy="15" r="3.4" />
  <circle class="off" cx="5"  cy="25" r="3.4" />
  <circle class="on"  cx="15" cy="25" r="3.4" />
  <circle class="off" cx="25" cy="25" r="3.4" />
</svg>
